# Tests de Fournil à chaque envoi (push) et à chaque demande de fusion.
# Ce workflow ne publie rien et ne modifie pas le site : il a seulement le droit de lire
# le dépôt. Le site reste publié par GitHub Pages depuis la branche main.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances de test
        run: npm ci
      - name: Navigateur pour les tests dans Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérification du code (ESLint)
        run: npx eslint .
      - name: Fichiers générés des recettes à jour
        run: node tools/importer-grigne.mjs --verifier
      - name: Tests
        run: npm test
        env:
          TZ: Europe/Paris

  # Règles Firestore et migration « équipe », sur l'émulateur Firestore seulement
  # (projet fictif demo-fournil : aucun lien avec la vraie base, rien n'est publié).
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances de test
        run: npm ci
      - name: Outil Firebase (émulateur uniquement)
        run: npm install --global firebase-tools@15.36.0
      - name: Règles et migration sur l'émulateur
        run: npm run test:regles
